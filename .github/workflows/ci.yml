name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Keep CI lightweight while installing every direct dependency imported
      # by the automated tests. Heavy video/ML packages are not needed here.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  workflows-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The backend image (PyTorch, OpenCV, MediaPipe) takes several GB; the
      # private repository's run hit "No space left on device". Remove
      # preinstalled toolchains this job never uses (it sets up no Python,
      # Node or Go). Housekeeping must never fail the build itself.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /opt/az || true
          sudo docker image prune --all --force || true
          df -h /
      - name: Build backend image
        run: docker build -t openshorts-backend .
      - name: Reclaim build cache
        run: |
          docker builder prune --all --force || true
          df -h /
      - name: Build dashboard image
        run: docker build -t openshorts-dashboard ./dashboard
