<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Deterministic substitutes for the fonts the subtitle UI offers.

  Arial Black, Impact, Verdana and Helvetica are proprietary and cannot ship in
  the image. Without these rules fontconfig silently collapsed ALL of them onto
  the same default sans, so five of the seven choices in the dropdown rendered
  identically - and a caption styled as Arial Black in the browser preview came
  out in a completely different, much lighter face.

  Mapping them explicitly does two things: every choice now renders as a
  visibly different face, and the result is reproducible instead of depending
  on whichever font happens to sort first on the host.

  The subtitle styles set Bold=1, so the bold cut of each family is used.
-->
<fontconfig>

  <!-- Arial / Helvetica -> Liberation Sans (metric-compatible with Arial). -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>

  <!-- Arial Black -> DejaVu Sans. Heavier and wider than Liberation Sans, so
       it stays visually distinct from the plain "Arial" choice. -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Arial Black</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>

  <!-- Impact -> DejaVu Sans Condensed: the narrow, tall caption look Impact is
       picked for. Requires fonts-dejavu-extra. -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Impact</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans Condensed</string></edit>
  </match>

  <!-- Verdana -> DejaVu Sans, whose Bitstream Vera ancestry gives it the same
       generous letter widths. -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Verdana</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>

  <!-- Georgia -> DejaVu Serif. -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Serif</string></edit>
  </match>

  <!-- Courier New -> Liberation Mono (metric-compatible). -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit>
  </match>

</fontconfig>
