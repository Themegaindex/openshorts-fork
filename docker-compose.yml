services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENSHORTS_API_TOKEN: ${OPENSHORTS_API_TOKEN:?Set OPENSHORTS_API_TOKEN for container access}
      OPENSHORTS_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - .:/app
      - /app/__pycache__
    restart: unless-stopped

  frontend:
    build: ./dashboard
    container_name: openshorts-frontend
    ports:
      - "127.0.0.1:5175:5173"
    environment:
      OPENSHORTS_API_TOKEN: ${OPENSHORTS_API_TOKEN:?Set OPENSHORTS_API_TOKEN for container access}
      OPENSHORTS_BACKEND_URL: http://backend:8000
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend
